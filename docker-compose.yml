version: '3.8'

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cresta
      POSTGRES_USER: cresta
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cresta_secure_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cresta" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # --- Redis (Cache + Celery Broker) ---
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # --- Django Backend (Gunicorn) ---
  backend:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://cresta:${DB_PASSWORD:-cresta_secure_pw}@db:5432/cresta
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_data:/app/saved_models
      - model_data:/app/recommender/saved_models
      - app_logs:/app/logs
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn robo_advisor.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G

  # --- Celery Worker (ML Tasks) ---
  celery_worker:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://cresta:${DB_PASSWORD:-cresta_secure_pw}@db:5432/cresta
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_data:/app/saved_models
      - model_data:/app/recommender/saved_models
      - app_logs:/app/logs
    command: python -m celery -A robo_advisor worker -l info --concurrency=2
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 12G

  # --- Celery Beat (Scheduled Tasks) ---
  celery_beat:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://cresta:${DB_PASSWORD:-cresta_secure_pw}@db:5432/cresta
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: python -m celery -A robo_advisor beat -l info
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  # --- Frontend (Nginx + React) ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ssl_certs:/etc/letsencrypt
    depends_on:
      - backend

volumes:
  postgres_data:
  model_data:
  redis_data:
  app_logs:
  ssl_certs:
