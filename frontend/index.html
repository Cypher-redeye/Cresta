<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cresta" />
    <meta name="format-detection" content="telephone=no" />
    <title>Cresta — AI Robo-Advisor</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Cresta is an intelligent AI-driven Robo-Advisory system offering personalized portfolio management and market insights for the Indian stock market." />
    <meta name="keywords" content="robo-advisor, stock market, indian equities, AI finance, portfolio management, wealth management" />
    <meta name="author" content="Cresta AI" />
    
    <!-- Open Graph / Social Media Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cresta | AI Robo-Advisor" />
    <meta property="og:description" content="Intelligent AI-driven portfolio management for Indian Equity Markets." />
    <meta property="og:image" content="https://crestafinance.me/cresta-logo.jpg" />
    <meta property="og:url" content="https://crestafinance.me" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-notion-bg text-notion-text antialiased selection:bg-accent-emerald/20 selection:text-accent-emerald">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
